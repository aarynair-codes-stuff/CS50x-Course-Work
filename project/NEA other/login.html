<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        body{
            background-color: #070a2a;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            text-align: center
        };
        form{
            color: #0b0e2e;
        }
        table{
            margin: 0px auto;
            background-color: #dee2fb;
            padding-top: 25px;
            padding-bottom: 25px;
            padding-left: 150px;
            padding-right: 150px;
            font-size: large;
        }
        #Reg{
            color: aliceblue;
            font-size: xxx-large;
        }
        #Submit{
             background-color: #7c90ea;
             border-radius: 20px;
             font-size: x-large;
             border-color: #7c90ea;
             border-style: hidden;
             padding: 10px;
        }
        a{
            position: static;
            font-size: 40px;
        }

    </style>

</head>
<body>

        <form>
            <br><b><label id="Reg">Login</label></b><br><br><br><br>


            <table>

            <tr>
            <td>Personal details</td>
            </tr>
            
            <tr>
            <td><label>Full Name</label></td>
            <td><label>Date of Birth</label></td>
            <td><label>Email</label></td>
            </tr>

            <tr>
            <td><input type="text"></td>
            <td><input type="text"></td>
            <td><input type="text"></td>
            </tr>

            <tr>
            <td><label>Mobile Number</label></td>
            <td><label>Gender</label></td>
            <td><label>Occupation</label></td>
            </tr>

            <tr>
            <td><input type="text"></td>
            <td><input type="text"></td>
            <td><input type="text"></td>
            </tr>

            <tr>
            <td>Identity details</td>
            </tr>

            <tr>
            <td><label>ID Type</label></td>
            <td><label>ID Number</label></td>
            <td><label>Issue Authority</label></td>
            </tr>

            <tr>
            <td><input type="text"></td>
            <td><input type="text"></td>
            <td><input type="text"></td>
            </tr>

            <tr>
            <td><label>Issue Date</label></td>
            <td><label>Issue State</label></td>
            <td><label>Expiry Date</label></td>
            </tr>

            <tr>
            <td><input type="text"></td>
            <td><input type="text"></td>
            <td><input type="text"></td>
            </tr>


            <tr>
            <td colspan="3"><input id="Submit" type="submit"></td>
            </tr>
            </table>
            
            <br><br><br><br><br><br><br><br><br>


            <a href="">Create An Account</a>
        </form>

</body>
</html>
